[workspace]
resolver = "3"
members = ["apk", "tls", "boot", "bootinfo", "ext2", "fat", "kernel", "sbc", "truetype", "user/desktop", "user/files", "user/term", "user/ui", "user/eli", "user/utils", "xtask"]
# The bootloader and kernel only build for their own targets, which xtask
# selects. A bare `cargo build` builds just the host-side tooling.
default-members = ["xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
debug = true
