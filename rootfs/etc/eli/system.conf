# eliOS system configuration
#
# This file describes this computer: its name, its accounts and the
# programs on it. Change it, then run `eli apply` to make the system match.
# (`eli add NAME` and `eli remove NAME` change the package list and apply
# in one go.) Every change makes a new generation, and `eli rollback` goes
# back to the one before.

hostname = elios

# Programs from Alpine Linux's repositories: `eli search WORD` finds them.
packages =

# Accounts (root always exists). Passwords are set with `passwd`.
# user alice
#     name = Alice Example
#     admin = yes
