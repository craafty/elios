[alias]
xtask = "run --quiet --package xtask --"

# Kernel code generation: linked at a fixed higher-half address (see
# kernel/linker.ld), so no position-independent code. Frame pointers are kept
# so we can produce stack traces on panic later.
[target.x86_64-unknown-none]
rustflags = [
    "-C", "relocation-model=static",
    "-C", "code-model=kernel",
    "-C", "force-frame-pointers=yes",
]

# User programs: static, non-relocatable Linux executables (eliOS implements
# the Linux system call ABI). Built with -Zbuild-std by xtask.
[target.x86_64-unknown-linux-none]
rustflags = ["-C", "target-feature=+crt-static", "-C", "relocation-model=static"]
